<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استودیوی طراحی دیجیتال</title>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --telegram-color: #2481cc;
            --telegram-hover: #1e6fa8;
            --rubika-color: #9333ea;
            --rubika-hover: #7e22ce;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        .logo {
            font-family: 'Lalezar', cursive;
            font-size: 1.8rem;
            color: var(--primary);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            margin-right: 15px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }

        h2 {
            font-family: 'Lalezar', cursive;
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            border-right: 4px solid var(--primary);
            padding-right: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
            transition: background 0.3s, transform 0.1s;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .telegram-btn {
            background: var(--telegram-color);
        }
        .telegram-btn:hover {
            background: var(--telegram-hover);
        }

        .rubika-btn {
            background: var(--rubika-color);
        }
        .rubika-btn:hover {
            background: var(--rubika-hover);
        }

        .admin-link-box {
            text-align: center;
            margin-top: 20px;
        }

        .admin-link-box a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .admin-link-box a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- هدر سایت -->
        <header>
            <div class="logo">استودیوی دیجیتال 🚀</div>
            <div class="nav-links">
                <a href="index.html">صفحه اصلی</a>
                <a href="login.html">ورود / حساب کاربری</a>
            </div>
        </header>

        <!-- بخش فرم ثبت سفارش -->
        <section class="card">
            <h2>ثبت سفارش پروژه</h2>
            <p>اطلاعات خود را وارد کنید و روی پیام‌رسان دلخواه جهت ارسال سفارش کلیک کنید.</p>
            
            <form id="orderForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="clientName">نام و نام خانوادگی:</label>
                    <input type="text" id="clientName" required placeholder="مثلاً علی رضایی">
                </div>

                <div class="form-group">
                    <label for="projectType">نوع پروژه:</label>
                    <select id="projectType">
                        <option value="طراحی وب‌سایت">طراحی وب‌سایت</option>
                        <option value="گرافیک و فتوشاپ">گرافیک و فتوشاپ</option>
                        <option value="سایر خدمات دیجیتال">سایر خدمات دیجیتال</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="clientContact">آیدی یا شماره تماس شما:</label>
                    <input type="text" id="clientContact" required placeholder="مثلاً @username یا شماره تماس">
                </div>

                <div class="form-group">
                    <label for="clientDesc">توضیحات پروژه:</label>
                    <textarea id="clientDesc" placeholder="جزئیات درخواست خود را بنویسید..."></textarea>
                </div>

                <!-- دکمه‌های ارسال به تلگرام و روبیکا -->
                <div class="buttons-container">
                    <button type="button" class="btn telegram-btn" onclick="sendOrder('telegram')">
                        <span>✈️</span> ارسال با تلگرام
                    </button>
                    <button type="button" class="btn rubika-btn" onclick="sendOrder('rubika')">
                        <span>💬</span> ارسال با روبیکا
                    </button>
                </div>
            </form>
        </section>

        <div class="admin-link-box">
            <a href="admin.html">ورود به پنل مدیریت 🔒</a>
        </div>

    </div>

    <script>
        function sendOrder(platform) {
            // گرفتن مقادیر فرم
            const name = document.getElementById('clientName').value;
            const type = document.getElementById('projectType').value;
            const contact = document.getElementById('clientContact').value;
            const desc = document.getElementById('clientDesc').value || 'بدون توضیحات';

            // بررسی پر بودن فیلدهای مهم
            if (!name || !contact) {
                alert('لطفاً نام و راه ارتباطی خود را وارد کنید!');
                return;
            }

            // ساخت متن پیام آماده
            const message = `سلام، سفارش جدید دارم!%0A👤 نام: ${name}%0A🛠 پروژه: ${type}%0A📞 راه ارتباطی: ${contact}%0A📝 توضیحات: ${desc}`;

            // تنظیمات آیدی‌های خودت (اینجا رو با آیدی خودت جایگزین کن)
            const telegramId = "@WreCKers_ir"; // مثال: alirezayi
            const rubikaId = "@Wild_Sniper"; // آیدی یا شماره روبیکا

            if (platform === 'telegram') {
                window.location.href = `https://t.me/${telegramId}?text=${message}`;
            } else if (platform === 'rubika') {
                // لینک هدایت به روبیکا (یا پروفایل/پی‌وی)
                window.location.href = `https://rubika.ir/${rubikaId}`;
            }
        }
    </script>

</body>
</html>
