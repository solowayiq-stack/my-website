<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیجیتال خاتم | صفحه سفارش</title>
    <style>
        /* استایل‌های پایه برای ظاهر سایت */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #0066cc;
            --border-color: #ddd;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --primary-color: #3399ff;
            --border-color: #444;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 1rem;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 5px;
        }

        .contact-group {
            display: flex;
            gap: 10px;
        }

        .contact-group select {
            flex: 1;
        }

        .contact-group input {
            flex: 2;
        }

        button[type="submit"] {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر سایت همراه با دکمه دارک/لایت مود -->
        <div class="header">
            <div class="logo">دیجیتال خاتم 🚀</div>
            <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
        </div>

        <!-- فرم ثبت سفارش -->
        <div class="card">
            <h2>ثبت سفارش مهر خاتم</h2>
            <p style="font-size: 0.85rem; opacity: 0.8;">اطلاعات و متن دلخواه خود را وارد کنید تا سفارش طراحی مهر شما مستقیماً ثبت و بررسی شود.</p>
            
            <form id="orderForm">
                <label>نام و نام خانوادگی:</label>
                <input type="text" name="name" placeholder="مثلاً علی رضایی" required>

                <label>نوع و مدل مهر:</label>
                <select name="seal_type">
                    <option>مهر خاتم سنتی</option>
                    <option>مهر خاتم مدرن</option>
                </select>

                <label>روش و اطلاعات ارتباطی (چت):</label>
                <div class="contact-group">
                    <input type="text" name="contact_info" placeholder="آیدی یا شماره تماس" required>
                    <select name="messenger">
                        <option>تلگرام (@)</option>
                        <option>روبیکا</option>
                        <option>ایتا</option>
                        <option>سروش</option>
                        <option>واتساپ</option>
                    </select>
                </div>

                <label>متن و جزئیات مهر (نام، لقب، طرح خاص):</label>
                <textarea name="details" rows="4" placeholder="متن مورد نظر برای روی مهر را بنویسید..." required></textarea>

                <button type="submit">ثبت نهایی سفارش مهر</button>
            </form>
        </div>
    </div>

    <!-- کدهای جاوااسکریپت برای مدیریت دارک‌مود و ارسال مستقیم به تلگرام -->
    <script>
        // ۱. منطق دکمه دارک‌مود و لایت‌مود
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }

        // اعمال حالت ذخیره شده قبلی هنگام باز شدن سایت
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        });

        // ۲. منطق ارسال اطلاعات فرم به ربات تلگرام
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // جمع‌آوری مقادیر فیلدها
            const name = document.querySelector('input[name="name"]').value;
            const sealType = document.querySelector('select[name="seal_type"]').value;
            const messenger = document.querySelector('select[name="messenger"]').value;
            const contactInfo = document.querySelector('input[name="contact_info"]').value;
            const details = document.querySelector('textarea[name="details"]').value;

            // ساخت قالب پیام برای ارسال به پی‌وی شما
            const message = `🚨 سفارش جدید در سایت دیجیتال خاتم:\n\n👤 نام و نام خانوادگی: ${name}\n🏷 نوع مهر: ${sealType}\n💬 پیام‌رسان: ${messenger}\n📞 اطلاعات ارتباطی: ${contactInfo}\n📝 جزئیات مهر:\n${details}`;

            const token = '8935228797:AAH5Wk8xecbxMJiwEXtbLEncrBEgHA_lBys';
            const chatId = '8217024475';
            const url = `https://api.telegram.org/bot${token}/sendMessage`;

            // ارسال درخواست به سرور تلگرام
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            })
            .then(response => {
                if (response.ok) {
                    alert('سفارش شما با موفقیت ثبت شد و به دست ما رسید! 🙏');
                    document.getElementById('orderForm').reset();
                } else {
                    alert('خطا در ارسال سفارش. لطفاً دوباره تلاش کنید.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('خطایی در ارتباط با سرور رخ داد.');
            });
        });
    </script>
</body>
</html>
