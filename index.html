<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیجیتال خاتم | زئوس گرافیک</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72, #2a5298);
            --box-bg: rgba(255, 255, 255, 0.08);
            --box-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --desc-color: #d0e1fd;
            --badge-bg: rgba(0, 0, 0, 0.2);
            --particle-color: rgba(255, 255, 255, 0.6);
            --line-color: rgba(255, 255, 255, 0.25);
        }
        [data-theme="green"] {
            --bg-gradient: linear-gradient(135deg, #85bb65, #2d5a27);
            --box-bg: rgba(255, 255, 255, 0.1);
            --box-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --desc-color: #e2f0d9;
            --badge-bg: rgba(0, 0, 0, 0.25);
            --particle-color: rgba(255, 255, 255, 0.6);
            --line-color: rgba(255, 255, 255, 0.35);
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease;
        }
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        /* دکمه تغییر تم */
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-color);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .theme-toggle:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.2);
        }
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .logo-box {
            background: var(--box-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--box-border);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            max-width: 400px;
            width: 100%;
            animation: fadeIn 1.2s ease-in-out;
        }
        .logo-box img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        p {
            font-size: 15px;
            color: var(--desc-color);
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: var(--badge-bg);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 0.5px;
            border: 1px solid var(--box-border);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-theme="blue">

    <!-- دکمه تعویض تم -->
    <button class="theme-toggle" id="themeToggleBtn">🎨 تغییر تم (سبز/آبی)</button>

    <!-- بوم انیمیشن ذرات -->
    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <div class="logo-box">
            <img src="logo.png" alt="Zeus Graphic Logo">
            <h1>زئوس گرافیک</h1>
            <p>مرکز تخصصی طراحی گرافیک و خدمات دیجیتال</p>
            <div class="badge">digitalkhatam.ir</div>
        </div>
    </div>

    <script>
        // مدیریت دکمه تغییر تم
        const toggleBtn = document.getElementById('themeToggleBtn');
        const body = document.body;

        toggleBtn.addEventListener('click', () => {
            if (body.getAttribute('data-theme') === 'blue') {
                body.setAttribute('data-theme', 'green');
                toggleBtn.textContent = '🎨 تم آبی (کلاسیک)';
            } else {
                body.setAttribute('data-theme', 'blue');
                toggleBtn.textContent = '🎨 تغییر تم (سبز/آبی)';
            }
        });

        // اسکریپت ساخت ذرات و خطوط متحرک
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.size = Math.random() * 3 + 1.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 15000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function connectParticles() {
            let maxDistance = 120;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a + 1; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        let opacity = 1 - (distance / maxDistance);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.35})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
