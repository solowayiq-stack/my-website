<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استودیوی طراحی دیجیتال</title>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --primary: #dc2626;
            --primary-hover: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        .logo {
            font-family: 'Lalezar', cursive;
            font-size: 1.8rem;
            color: var(--primary);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            margin-right: 15px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }

        h2 {
            font-family: 'Lalezar', cursive;
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            border-right: 4px solid var(--primary);
            padding-right: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        .submit-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            transition: background 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .admin-link-box {
            text-align: center;
            margin-top: 20px;
        }

        .admin-link-box a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .admin-link-box a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- هدر سایت -->
        <header>
            <div class="logo">استودیوی دیجیتال 🚀</div>
            <div class="nav-links">
                <a href="index.html">صفحه اصلی</a>
                <a href="login.html">ورود / حساب کاربری</a>
            </div>
        </header>

        <!-- بخش معرفی و فرم ثبت سفارش -->
        <section class="card">
            <h2>ثبت سفارش پروژه</h2>
            <p>مشخصات و نوع پروژه خود را وارد کنید تا بررسی شود.</p>
            
            <!-- فرم سفارشی که بدون خطای سرور با جاوااسکریپت مدیریت میشه -->
            <form id="orderForm" onsubmit="handleOrderSubmit(event)">
                <div class="form-group">
                    <label for="clientName">نام و نام خانوادگی:</label>
                    <input type="text" id="clientName" required placeholder="مثلاً علی رضایی">
                </div>

                <div class="form-group">
                    <label for="projectType">نوع پروژه:</label>
                    <select id="projectType">
                        <option value="طراحی وب‌سایت">طراحی وب‌سایت</option>
                        <option value="گرافیک و فتوشاپ">گرافیک و فتوشاپ</option>
                        <option value="سایر خدمات دیجیتال">سایر خدمات دیجیتال</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="clientDesc">توضیحات و راه ارتباطی (روبیکا، تلگرام یا شماره تماس):</label>
                    <textarea id="clientDesc" required placeholder="جزئیات درخواست و آیدی یا شماره تماس خود را بنویسید..."></textarea>
                </div>

                <button type="submit" class="submit-btn">ارسال سفارش</button>
            </form>
        </section>

        <!-- لینک مخفی یا ساده برای رفتن به پنل ادمین -->
        <div class="admin-link-box">
            <a href="admin.html">ورود به پنل مدیریت 🔒</a>
        </div>

    </div>

    <!-- اسکریپت جلوگیری از ارور 405 و نمایش پیام موفقیت -->
    <script>
        function handleOrderSubmit(event) {
            event.preventDefault(); // مانع از رفرش شدن اجباری یا خطای سرور میشه

            // گرفتن مقادیر فرم
            const name = document.getElementById('clientName').value;
            const type = document.getElementById('projectType').value;

            // نمایش پیام موفقیت به کاربر
            alert(`کاربر گرامی ${name}، سفارش شما در زمینه "${type}" با موفقیت ثبت شد! به زودی بررسی خواهد شد.`);

            // پاک کردن فرم و رفرش ملایم صفحه برای بازگشت به حالت اولیه
            document.getElementById('orderForm').reset();
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
