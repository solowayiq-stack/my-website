<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سفارشات</title>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .logo {
            font-family: 'Lalezar', cursive;
            font-size: 2rem;
            color: var(--primary);
            text-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            margin-right: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        h2 {
            font-family: 'Lalezar', cursive;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--text-main);
            border-right: 4px solid var(--primary);
            padding-right: 12px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* استایل فرم ورود رمز ادمین */
        #login-section {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }

        .admin-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .admin-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
            background: var(--primary);
            transition: all 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        /* استایل کارت‌های سفارش در پنل ادمین */
        .order-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .order-card h3 {
            color: var(--text-main);
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .order-card p {
            margin-bottom: 5px;
        }

        .order-date {
            font-size: 0.8rem;
            color: var(--primary);
            margin-bottom: 10px;
            display: inline-block;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        #admin-panel {
            display: none;
        }

        .error-msg {
            color: var(--primary);
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- هدر سایت -->
        <header>
            <div class="logo">مدیریت سفارشات 🔒</div>
            <div class="nav-links">
                <a href="index.html">بازگشت به سایت</a>
            </div>
        </header>

        <!-- بخش اول: ورود رمز عبور -->
        <div id="login-section" class="card">
            <h2>ورود ادمین</h2>
            <p>لطفاً رمز عبور پنل مدیریت را وارد کنید.</p>
            <br>
            <input type="password" id="adminPassword" class="admin-input" placeholder="رمز عبور...">
            <button onclick="checkPassword()" class="btn">ورود به پنل</button>
            <div id="loginError" class="error-msg"></div>
        </div>

        <!-- بخش دوم: نمایش لیست سفارش‌ها (بعد از ورود رمز نمایش داده می‌شود) -->
        <div id="admin-panel">
            <div class="card">
                <h2>لیست سفارش‌های ثبت شده</h2>
                <p>در این قسمت می‌توانید سفارش‌های جدید کاربران را مشاهده کنید.</p>
                <br>
                <div id="ordersList">
                    <!-- سفارش‌ها به صورت دینامیک اینجا قرار می‌گیرند -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // رمز عبور پنل مدیریت
        const CORRECT_PASSWORD = "soloway2025#";

        function checkPassword() {
            const passInput = document.getElementById("adminPassword").value;
            const errorDiv = document.getElementById("loginError");

            if (passInput === CORRECT_PASSWORD) {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("admin-panel").style.display = "block";
                loadOrders();
            } else {
                errorDiv.innerHTML = "رمز عبور اشتباه است!";
            }
        }

        function loadOrders() {
            const ordersList = document.getElementById("ordersList");
            let orders = JSON.parse(localStorage.getItem("siteOrders")) || [];

            if (orders.length === 0) {
                ordersList.innerHTML = "<p>هنوز سفارشی ثبت نشده است.</p>";
                return;
            }

            ordersList.innerHTML = "";
            orders.forEach((order, index) => {
                ordersList.innerHTML += `
                    <div class="order-card">
                        <span class="order-date">📅 ${order.date}</span>
                        <h3>👤 نام: ${order.name}</h3>
                        <p><strong>🛠 نوع پروژه:</strong> ${order.type}</p>
                        <p><strong>📞 راه ارتباطی:</strong> ${order.contact}</p>
                        <p><strong>📝 توضیحات:</strong> ${order.description}</p>
                        <button class="delete-btn" onclick="deleteOrder(${index})">حذف سفارش</button>
                    </div>
                `;
            });
        }

        function deleteOrder(index) {
            let orders = JSON.parse(localStorage.getItem("siteOrders")) || [];
            orders.splice(index, 1);
            localStorage.setItem("siteOrders", JSON.stringify(orders));
            loadOrders();
        }
    </script>

</body>
</html>
